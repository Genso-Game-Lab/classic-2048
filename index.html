<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display:flex; flex-direction:column; align-items:center;
    touch-action: none;
    user-select:none; -webkit-user-select:none;
    min-height:100%;
  }
  .wrap { width:min(94vw, 460px); padding:10px 0 20px; }
  header { display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:8px; }
  h1 { font-size:1.5rem; letter-spacing:.04em; }
  h1 small { display:block; font-size:.63rem; color:#94a3b8; font-weight:normal; margin-top:2px; }
  .stats { display:flex; gap:6px; }
  .stat {
    background:#1e293b; border-radius:8px; padding:4px 10px; text-align:center; min-width:60px;
  }
  .stat .label { font-size:.6rem; color:#94a3b8; }
  .stat .value { font-size:1rem; font-weight:bold; }
  .bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; gap:8px; }
  .hint { font-size:.68rem; color:#94a3b8; }
  .btns2 { display:flex; gap:6px; flex-shrink:0; }
  button {
    background:#334155; color:#e2e8f0; border:none; border-radius:8px;
    padding:8px 12px; font-size:.78rem; font-weight:bold; cursor:pointer;
  }
  button:active { background:#475569; }
  button:disabled { opacity:.35; }
  #undoBtn { background:#155e75; }
  .board {
    position:relative; width:100%; aspect-ratio:1/1;
    background:#1e293b; border-radius:12px;
    touch-action:none;
  }
  .bg-cell { position:absolute; background:#0f172a55; border-radius:8px; }
  .tile {
    position:absolute; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    line-height:1;
    transition: transform .12s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    will-change: transform;
    font-weight:bold;
  }
  .tile.new { animation: appear .16s ease .1s backwards; }
  .tile.pop { animation: pop .18s ease .08s backwards; }
  @keyframes appear { from { transform: scale(0); } }
  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .toast {
    position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(120%);
    background:#1e293b; border:1px solid #334155; border-radius:12px;
    padding:10px 16px; font-size:.78rem; max-width:90vw; text-align:center;
    transition: transform .3s ease; z-index:20; box-shadow:0 4px 16px rgba(0,0,0,.5);
  }
  .toast.show { transform:translateX(-50%) translateY(0); }

  .overlay {
    position:absolute; inset:0; border-radius:12px;
    background:rgba(15,23,42,.86); backdrop-filter:blur(2px);
    display:none; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    text-align:center; z-index:10; padding:16px;
  }
  .overlay.show { display:flex; }
  .overlay h2 { font-size:1.5rem; }
  .overlay p { font-size:.85rem; color:#cbd5e1; }
  .overlay .btns { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .overlay button.primary { background:#3b82f6; }
  .overlay button.rescue { background:#155e75; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048<small>ひろい7×7ばんで 2048 をつくれ！</small></h1>
    <div class="stats">
      <div class="stat"><div class="label">スコア</div><div class="value" id="score">0</div></div>
      <div class="stat"><div class="label">ベスト</div><div class="value" id="best">0</div></div>
      <div class="stat"><div class="label">最高タイル</div><div class="value" id="bestTile">-</div></div>
    </div>
  </header>
  <div class="bar">
    <div class="hint">スワイプ（PCは矢印キー）で移動</div>
    <div class="btns2">
      <button id="undoBtn" disabled>↩ もどす</button>
      <button id="newGame">新しいゲーム</button>
    </div>
  </div>
  <div class="board" id="board">
    <div class="overlay" id="overlay">
      <h2 id="ovTitle"></h2>
      <p id="ovText"></p>
      <div class="btns">
        <button class="rescue" id="ovUndo" style="display:none">↩ 1手もどして続ける</button>
        <button class="primary" id="ovRestart">もう一度</button>
        <button id="ovContinue" style="display:none">続ける</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const WIN_V = 2048;
// 数字ごとに全部ちがう色（黄金角配色：隣の数ほど色が大きく変わる）
function colorFor(v) {
  const k = Math.round(Math.log2(v));
  const hue = Math.round((k * 137.508) % 360);
  const bg = `linear-gradient(135deg, hsl(${hue},80%,58%), hsl(${hue},74%,43%))`;
  const fg = (hue > 40 && hue < 80) ? "#1e293b" : "#ffffff";
  return [bg, fg];
}

// ===== 状態 =====
const SIZE = 7;
let grid, tiles, nextId, score, moved, won, awaiting, over;
let best = +(localStorage.getItem("classic2048Best") || 0);
let bestTile = +(localStorage.getItem("classic2048BestTile") || 0);
let undoState = null;
let moveCounter = 0;

const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const bestTileEl = document.getElementById("bestTile");
const overlay = document.getElementById("overlay");
const ovTitle = document.getElementById("ovTitle");
const ovText = document.getElementById("ovText");
const ovContinue = document.getElementById("ovContinue");
const ovUndo = document.getElementById("ovUndo");
const undoBtn = document.getElementById("undoBtn");
const toastEl = document.getElementById("toast");

let cell = 0, gap = 0;
const tileEls = new Map();

// ===== レイアウト =====
function layout() {
  const w = boardEl.clientWidth;
  gap = Math.round(w * 0.014);
  cell = (w - gap * (SIZE + 1)) / SIZE;
  boardEl.querySelectorAll(".bg-cell").forEach(e => e.remove());
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const d = document.createElement("div");
    d.className = "bg-cell";
    d.style.width = d.style.height = cell + "px";
    d.style.left = (gap + c * (cell + gap)) + "px";
    d.style.top = (gap + r * (cell + gap)) + "px";
    boardEl.appendChild(d);
  }
  for (const t of tiles.values()) positionEl(t);
}

function fontFor(v) {
  const len = String(v).length;
  return len <= 2 ? 0.42 : len === 3 ? 0.36 : len === 4 ? 0.3 : 0.24;
}

function positionEl(t) {
  const el = tileEls.get(t.id);
  if (!el) return;
  el.style.width = el.style.height = cell + "px";
  el.style.fontSize = (cell * fontFor(t.v)) + "px";
  el.style.transform = `translate(${gap + t.c * (cell + gap)}px, ${gap + t.r * (cell + gap)}px)`;
}

function makeEl(t, cls) {
  const el = document.createElement("div");
  el.className = "tile" + (cls ? ` ${cls}` : "");
  const [bg, fg] = colorFor(t.v);
  el.style.background = bg;
  el.style.color = fg;
  el.textContent = t.v;
  tileEls.set(t.id, el);
  boardEl.appendChild(el);
  positionEl(t);
  return el;
}

function removeEl(id, delay) {
  const el = tileEls.get(id);
  tileEls.delete(id);
  if (el) setTimeout(() => el.remove(), delay);
}

// ===== ゲームロジック =====
function newGame() {
  moveCounter++;
  undoState = null;
  updateUndoBtn();
  for (const el of tileEls.values()) el.remove();
  tileEls.clear();
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  tiles = new Map();
  nextId = 1; score = 0; won = false; awaiting = false; over = false;
  overlay.classList.remove("show");
  updateHud();
  layout();
  spawn(); spawn();
}

function emptyCells() {
  const out = [];
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++)
    if (!grid[r][c]) out.push([r, c]);
  return out;
}

function spawn() {
  const empty = emptyCells();
  if (!empty.length) return;
  const [r, c] = empty[Math.floor(Math.random() * empty.length)];
  const t = { id: nextId++, v: Math.random() < 0.9 ? 2 : 4, r, c };
  grid[r][c] = t;
  tiles.set(t.id, t);
  makeEl(t, "new");
}

const VEC = {
  up:    { r: -1, c: 0 },
  down:  { r: 1,  c: 0 },
  left:  { r: 0,  c: -1 },
  right: { r: 0,  c: 1 },
};

function inB(r, c) { return r >= 0 && r < SIZE && c >= 0 && c < SIZE; }

function snapshot() {
  return {
    tiles: [...tiles.values()].map(t => ({ id: t.id, v: t.v, r: t.r, c: t.c })),
    score, nextId, won,
  };
}

function move(dir) {
  if (over || awaiting) return;
  const snap = snapshot();
  const v = VEC[dir];
  const rows = [...Array(SIZE).keys()]; if (v.r === 1) rows.reverse();
  const cols = [...Array(SIZE).keys()]; if (v.c === 1) cols.reverse();
  moved = false;
  for (const t of tiles.values()) t.mergedNow = false;

  for (const r of rows) for (const c of cols) {
    const t = grid[r][c];
    if (!t) continue;
    let nr = r, nc = c;
    while (inB(nr + v.r, nc + v.c) && !grid[nr + v.r][nc + v.c]) { nr += v.r; nc += v.c; }
    const tr = nr + v.r, tc = nc + v.c;
    const next = inB(tr, tc) ? grid[tr][tc] : null;

    if (next && next.v === t.v && !next.mergedNow) {
      const m = { id: nextId++, v: t.v * 2, r: tr, c: tc, mergedNow: true };
      grid[r][c] = null;
      grid[tr][tc] = m;
      tiles.delete(t.id); tiles.delete(next.id);
      tiles.set(m.id, m);
      t.r = tr; t.c = tc;
      positionEl(t);
      removeEl(t.id, 160);
      removeEl(next.id, 160);
      makeEl(m, "pop");
      score += m.v;
      moved = true;
      onCreate(m.v);
    } else if (nr !== r || nc !== c) {
      grid[r][c] = null;
      t.r = nr; t.c = nc;
      grid[nr][nc] = t;
      positionEl(t);
      moved = true;
    }
  }

  if (moved) {
    undoState = snap;
    updateUndoBtn();
    if (score > best) { best = score; localStorage.setItem("classic2048Best", best); }
    updateHud();
    const seq = ++moveCounter;
    setTimeout(() => {
      if (seq !== moveCounter) return;
      spawn();
      if (!canMove()) gameOver();
    }, 130);
  }
}

function undo() {
  if (!undoState) return;
  moveCounter++;
  for (const el of tileEls.values()) el.remove();
  tileEls.clear();
  grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
  tiles = new Map();
  for (const s of undoState.tiles) {
    const t = { id: s.id, v: s.v, r: s.r, c: s.c };
    grid[t.r][t.c] = t;
    tiles.set(t.id, t);
    makeEl(t);
  }
  score = undoState.score;
  nextId = undoState.nextId;
  won = undoState.won;
  over = false; awaiting = false;
  overlay.classList.remove("show");
  undoState = null;
  updateUndoBtn();
  updateHud();
}

function updateUndoBtn() {
  undoBtn.disabled = !undoState;
}

function onCreate(val) {
  if (val > bestTile) {
    bestTile = val;
    localStorage.setItem("classic2048BestTile", bestTile);
    updateHud();
  }
  if (val >= WIN_V && !won) {
    won = true;
    awaiting = true;
    setTimeout(() => {
      ovTitle.textContent = "🎉 2048たっせい！";
      ovText.textContent = "おめでとう！このまま4096、8192…とどこまでも続けられるよ。";
      ovContinue.style.display = "";
      ovUndo.style.display = "none";
      overlay.classList.add("show");
    }, 350);
  }
}

function canMove() {
  if (emptyCells().length) return true;
  for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
    const t = grid[r][c];
    if ((inB(r, c + 1) && grid[r][c + 1].v === t.v) ||
        (inB(r + 1, c) && grid[r + 1][c].v === t.v)) return true;
  }
  return false;
}

function gameOver() {
  over = true;
  let m = 0;
  for (const t of tiles.values()) if (t.v > m) m = t.v;
  setTimeout(() => {
    ovTitle.textContent = "ゲームオーバー";
    ovText.textContent = `スコア ${score}・最高タイルは ${m} だった！`;
    ovContinue.style.display = "none";
    ovUndo.style.display = undoState ? "" : "none";
    overlay.classList.add("show");
  }, 250);
}

function updateHud() {
  scoreEl.textContent = score;
  bestEl.textContent = best;
  bestTileEl.textContent = bestTile || "-";
}

let toastTimer;
function toast(html) {
  toastEl.innerHTML = html;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove("show"), 3200);
}

// ===== 入力 =====
document.addEventListener("keydown", e => {
  const map = {
    ArrowUp: "up", ArrowDown: "down", ArrowLeft: "left", ArrowRight: "right",
    w: "up", s: "down", a: "left", d: "right",
  };
  const dir = map[e.key];
  if (dir) { e.preventDefault(); move(dir); }
});

let sx = 0, sy = 0, swiping = false;
document.addEventListener("touchstart", e => {
  if (e.touches.length !== 1) return;
  sx = e.touches[0].clientX; sy = e.touches[0].clientY; swiping = true;
}, { passive: true });
document.addEventListener("touchmove", e => e.preventDefault(), { passive: false });
document.addEventListener("touchend", e => {
  if (!swiping) return;
  swiping = false;
  const dx = e.changedTouches[0].clientX - sx;
  const dy = e.changedTouches[0].clientY - sy;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
});

document.getElementById("newGame").addEventListener("click", newGame);
document.getElementById("ovRestart").addEventListener("click", newGame);
undoBtn.addEventListener("click", undo);
ovUndo.addEventListener("click", undo);
ovContinue.addEventListener("click", () => {
  awaiting = false;
  overlay.classList.remove("show");
});
window.addEventListener("resize", layout);

newGame();
</script>
</body>
</html>
